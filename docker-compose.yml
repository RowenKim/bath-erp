# 로컬 개발:  docker compose up -d db          → DB만 띄우고 C#은 dotnet run
# 서버 배포:  docker compose --profile app up -d --build   → DB + 앱 함께
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64            # Apple Silicon 맥은 Rosetta로 실행
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"           # 운영에 써도 무료인 에디션
      MSSQL_SA_PASSWORD: "BathErp!2026"
      MSSQL_MEMORY_LIMIT_MB: "2048"
      TZ: "Asia/Seoul"               # DB가 찍는 시각(SYSDATETIME)을 한국 시간으로
    ports:
      - "127.0.0.1:1433:1433"        # 내 컴퓨터에서만 접속 가능 (외부에 DB 포트 노출 안 함)
    volumes:
      - mssql-data:/var/opt/mssql
      - ./db:/db:ro                  # SQL 스크립트를 컨테이너 안 /db 에서 실행

  app:
    image: bath-erp-app:latest       # 맥에서 만든 이미지를 서버로 보내면 빌드 없이 이걸 사용
    build: .
    profiles: ["app"]
    environment:
      ConnectionStrings__BathErp: "Server=db,1433;Database=BathErp;User Id=sa;Password=BathErp!2026;TrustServerCertificate=True;"
      TZ: "Asia/Seoul"
    ports:
      - "127.0.0.1:8080:8080"        # 서버 내부 전용. 외부는 Nginx(80/443)를 거쳐서만 들어오게
    depends_on:
      - db

volumes:
  mssql-data:
